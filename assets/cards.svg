<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="190">
  <style>
    .card-header {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #58a6ff;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #e6edf3;
    }
    .card-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      fill: #8b949e;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #c9d1d9;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #8b949e;
    }
  </style>

  <!-- CARD 1: Experience & Role (X=0..288) -->
  <rect x="1" y="4" width="286" height="180" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="20" y="32" class="card-header">experience / profile</text>
  <rect x="218" y="18" width="52" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="228" y="32" class="meta-text">Active</text>

  <text x="20" y="68" class="card-title">2+ Years</text>
  <text x="20" y="90" class="card-text">Frontend Developer</text>
  <text x="20" y="110" class="card-text">SPA, SSR &amp; responsive web interfaces</text>

  <!-- Bottom Meta Row like GitHub Repo Card -->
  <circle cx="26" cy="156" r="5" fill="#3fb950" />
  <text x="38" y="160" class="meta-text">Open to collaboration</text>
  <text x="180" y="160" class="meta-text">TG: @Zhurravlev</text>

  <!-- CARD 2: Frameworks & SSR (X=306..594) -->
  <rect x="307" y="4" width="286" height="180" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="326" y="32" class="card-header">stack / frameworks</text>
  <text x="326" y="56" class="card-text">Primary ecosystems for production apps:</text>

  <!-- Pills Grid -->
  <rect x="326" y="72" width="118" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="342" cy="88" r="5" fill="#41b883" />
  <text x="354" y="92" class="pill-text">Vue 3</text>

  <rect x="454" y="72" width="118" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="470" cy="88" r="5" fill="#00dc82" />
  <text x="482" y="92" class="pill-text">Nuxt</text>

  <rect x="326" y="114" width="118" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="342" cy="130" r="5" fill="#61dafb" />
  <text x="354" y="134" class="pill-text">React</text>

  <rect x="454" y="114" width="118" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="470" cy="130" r="5" fill="#e6edf3" />
  <text x="482" y="134" class="pill-text">Next.js</text>

  <text x="326" y="166" class="meta-text">Component architecture • State &amp; SSR</text>

  <!-- CARD 3: Languages & Styling (X=612..899) -->
  <rect x="613" y="4" width="286" height="180" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="632" y="32" class="card-header">stack / core-languages</text>
  <text x="632" y="56" class="card-text">Core web technologies &amp; styling:</text>

  <rect x="632" y="72" width="118" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="648" cy="88" r="5" fill="#3178c6" />
  <text x="660" y="92" class="pill-text">TypeScript</text>

  <rect x="760" y="72" width="118" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="776" cy="88" r="5" fill="#f1e05a" />
  <text x="788" y="92" class="pill-text">JavaScript</text>

  <rect x="632" y="114" width="76" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="646" cy="130" r="4.5" fill="#e34c26" />
  <text x="656" y="134" class="pill-text">HTML5</text>

  <rect x="716" y="114" width="76" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="730" cy="130" r="4.5" fill="#563d7c" />
  <text x="740" y="134" class="pill-text">CSS3</text>

  <rect x="800" y="114" width="78" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="814" cy="130" r="4.5" fill="#c6538c" />
  <text x="824" y="134" class="pill-text">SCSS</text>

  <text x="632" y="166" class="meta-text">Strict typing • Semantic &amp; responsive UI</text>
</svg>

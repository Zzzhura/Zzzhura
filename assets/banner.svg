<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #f8fafc;
      letter-spacing: -0.8px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16.5px;
      font-weight: 600;
      fill: url(#accent);
      letter-spacing: 0.3px;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
    }
  </style>

  <!-- Main Background -->
  <rect x="0" y="0" width="900" height="280" rx="18" fill="url(#bg)" />
  <rect x="0" y="0" width="900" height="280" rx="18" fill="url(#grid)" />
  <rect x="0" y="0" width="900" height="280" rx="18" fill="url(#glow1)" />
  <rect x="0" y="0" width="900" height="280" rx="18" fill="url(#glow2)" />
  <rect x="1" y="1" width="898" height="278" rx="17" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Left Content (Absolute Coordinates) -->
  <!-- Status Pill -->
  <rect x="44" y="48" width="215" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="60" cy="62" r="4.5" fill="#4ade80">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <text x="72" y="66" class="badge-text">2+ YEARS OF EXPERIENCE</text>

  <!-- Name & Role -->
  <text x="44" y="122" class="title">Ivan Zhuravlev</text>
  <text x="44" y="151" class="subtitle">Frontend Developer • UI &amp; Web Architecture</text>

  <!-- Description -->
  <text x="44" y="183" class="desc">Crafting fast, accessible, and scalable web interfaces with</text>
  <text x="44" y="203" class="desc">TypeScript, Vue 3 / Nuxt, and React / Next.js ecosystems.</text>

  <!-- Tech Stack Pills -->
  <rect x="44" y="224" width="88" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.5" />
  <text x="55" y="241" class="badge-text" fill="#60a5fa">TypeScript</text>

  <rect x="140" y="224" width="62" height="26" rx="6" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.5" />
  <text x="154" y="241" class="badge-text" fill="#4ade80">Vue 3</text>

  <rect x="210" y="224" width="58" height="26" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-opacity="0.5" />
  <text x="224" y="241" class="badge-text" fill="#2dd4bf">Nuxt</text>

  <rect x="276" y="224" width="62" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" />
  <text x="289" y="241" class="badge-text" fill="#38bdf8">React</text>

  <rect x="346" y="224" width="70" height="26" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.5" />
  <text x="358" y="241" class="badge-text" fill="#f8fafc">Next.js</text>

  <!-- Right Code Card (Absolute Coordinates: X=544, Y=38) -->
  <rect x="544" y="38" width="316" height="204" rx="14" fill="url(#cardBg)" stroke="#475569" stroke-opacity="0.55" stroke-width="1.2" />
  <circle cx="564" cy="58" r="5" fill="#f87171" />
  <circle cx="580" cy="58" r="5" fill="#fbbf24" />
  <circle cx="596" cy="58" r="5" fill="#4ade80" />
  <text x="664" y="62" class="code-text" fill="#64748b">developer.ts</text>
  <line x1="544" y1="74" x2="860" y2="74" stroke="#334155" stroke-opacity="0.6" />

  <!-- Code Content -->
  <text x="564" y="100" class="code-text">
    <tspan fill="#c084fc">const</tspan> <tspan fill="#38bdf8">developer</tspan> <tspan fill="#94a3b8">=</tspan> <tspan fill="#fbbf24">{</tspan>
  </text>
  <text x="580" y="122" class="code-text">
    <tspan fill="#e2e8f0">name:</tspan> <tspan fill="#4ade80">'Ivan Zhuravlev'</tspan><tspan fill="#94a3b8">,</tspan>
  </text>
  <text x="580" y="144" class="code-text">
    <tspan fill="#e2e8f0">role:</tspan> <tspan fill="#4ade80">'Frontend Developer'</tspan><tspan fill="#94a3b8">,</tspan>
  </text>
  <text x="580" y="166" class="code-text">
    <tspan fill="#e2e8f0">experience:</tspan> <tspan fill="#f472b6">'2+ years'</tspan><tspan fill="#94a3b8">,</tspan>
  </text>
  <text x="580" y="188" class="code-text">
    <tspan fill="#e2e8f0">core:</tspan> <tspan fill="#94a3b8">[</tspan><tspan fill="#4ade80">'Vue 3'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#38bdf8">'React'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#60a5fa">'TS'</tspan><tspan fill="#94a3b8">],</tspan>
  </text>
  <text x="580" y="210" class="code-text">
    <tspan fill="#e2e8f0">telegram:</tspan> <tspan fill="#38bdf8">'@Zhurravlev'</tspan>
  </text>
  <text x="564" y="230" class="code-text">
    <tspan fill="#fbbf24">}</tspan><tspan fill="#94a3b8">;</tspan>
  </text>
</svg>
